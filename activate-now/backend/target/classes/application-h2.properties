# H2 in-memory DB - lets a reviewer run the app instantly with no external DB setup.
# Same JPA entities/schema as MySQL profile; H2 dialect auto-detected.
spring.datasource.url=jdbc:h2:mem:activatenow;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.sql.init.mode=always
