# Default profile = mysql (matches the challenge's "backed by a real DB (MySQL expected)"
# requirement). Start MySQL first: docker-compose up -d (from the repo root).
# For a zero-setup quick run without Docker, use: mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring.profiles.active=mysql
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
